repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["app", "tests"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: []
        additional_dependencies:
          - requests==2.34.2
          - zeroconf==0.151.5
          - flask==3.1.3
          - flasgger==0.9.7.1
          - websocket-client==1.9.2

          - typing_extensions==4.16.0
