name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*'

env:
  DOCKER_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/soundtouch-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker-hub
    
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release and select image tags
        id: release
        run: python3 .github/scripts/docker_release.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output publication information
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          printf 'Release channel: %s\nPublished image tags:\n%s\n' "$RELEASE_CHANNEL" "$IMAGE_TAGS"
